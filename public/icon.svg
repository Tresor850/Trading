<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0d" />
      <stop offset="50%" stop-color="#111815" />
      <stop offset="100%" stop-color="#050807" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="4" />

  <!-- Geometric Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6,8" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#10b981" stroke-opacity="0.05" stroke-width="2" />

  <!-- Candlesticks & Trading Chart Lines -->
  <g opacity="0.4">
    <!-- Candle 1 -->
    <line x1="140" y1="210" x2="140" y2="330" stroke="#10b981" stroke-width="2" />
    <rect x="132" y="240" width="16" height="60" rx="3" fill="#10b981" />
    <!-- Candle 2 -->
    <line x1="180" y1="180" x2="180" y2="310" stroke="#f43f5e" stroke-width="2" opacity="0.6" />
    <rect x="172" y="210" width="16" height="50" rx="3" fill="#f43f5e" opacity="0.7" />
    <!-- Candle 3 -->
    <line x1="330" y1="170" x2="330" y2="300" stroke="#10b981" stroke-width="2" />
    <rect x="322" y="190" width="16" height="70" rx="3" fill="#10b981" />
    <!-- Candle 4 -->
    <line x1="372" y1="140" x2="372" y2="280" stroke="#10b981" stroke-width="2" />
    <rect x="364" y="160" width="16" height="80" rx="3" fill="#10b981" />
  </g>

  <!-- Central Futuristic Trading Bot Hexagon Logo -->
  <g filter="url(#glow)">
    <!-- Hex Shield -->
    <polygon points="256,120 370,186 370,326 256,392 142,326 142,186" fill="#111c16" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round" />
    <!-- Inner Accent -->
    <polygon points="256,144 348,198 348,314 256,368 164,314 164,198" fill="#0c1611" stroke="#34d399" stroke-opacity="0.3" stroke-width="3" />
    
    <!-- Central Dynamic Trending Indicator (Lightning / Up-Trend Arrow) -->
    <path d="M220 280 L256 180 L292 240 L340 180" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="340" cy="180" r="10" fill="#6ee7b7" />

    <!-- Bot Eyes / Sensor Bar -->
    <rect x="210" y="300" width="92" height="18" rx="9" fill="#10b981" />
    <circle cx="236" cy="309" r="4.5" fill="#ffffff" />
    <circle cx="276" cy="309" r="4.5" fill="#ffffff" />
  </g>

  <!-- Binance Diamond Emblem at the bottom -->
  <g transform="translate(256, 436) scale(0.7)">
    <!-- Binance-styled diamond -->
    <polygon points="0,-16 16,0 0,16 -16,0" fill="#f0b90b" />
    <polygon points="0,-28 8,-20 0,-12 -8,-20" fill="#f0b90b" opacity="0.8" />
  </g>
</svg>
